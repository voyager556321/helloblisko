<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HaloBlisko Senior</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap">
<style>
/* Home tablet / phone for one paired senior (route /d/[token]). Logic = repo commit 037e691:
   one hold-to-talk control, no login, no list, no tabs. States: idle → recording → sending → ready → assigned → revealed → done | cancelled.
   F-pattern: greeting row → status card (if open) → main voice control → fallback.
   WCAG 2.1: ink/white 16.9 · navy/white 10.8 · muted/white 7.0 · ink/orange 7.7 (lightest gradient stop 9.1) · red/white 6.6 · green/white 5.4. */
:root{
  --navy:#0D3B7E; --navy-deep:#0A2D61; --tile:#EEF3FA; --tile-2:#E6EDF8;
  --orange:#F7992B; --orange-deep:#EE8A17; --orange-soft:#FFF1E0; --orange-text:#A65A00;
  --ink:#0F1D33; --muted:#4A5A75; --line:#E3E8F0; --field:#7D8CA5; --screen:#F4F7FB; --soft:#F6F8FB;
  --green:#1E7A46; --green-soft:#E7F5EC; --red:#B42318; --red-soft:#FDECEA;
  --stage:#F3F5F9; --blob:#173F78;
  --shadow:0 1px 2px rgba(15,29,51,.05),0 8px 24px -12px rgba(15,29,51,.18);
  --f:"Nunito Sans","Segoe UI","Helvetica Neue",Arial,sans-serif;
  --g:24px; --r:22px;
  color-scheme:light;
}
:root.big{font-size:112%}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--ink);font:400 1.1875rem/1.4 var(--f);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:left}
:focus-visible{outline:3px solid var(--navy);outline-offset:3px}
h1,h2,p{margin:0}
.muted{color:var(--muted)}

/* device frame (iPhone 15, scaled as a whole) */
.stage{position:relative;min-height:100%;display:grid;place-items:center;padding:24px 16px;overflow:hidden}
.blob{position:absolute;border-radius:50%;background:var(--blob);pointer-events:none}
.blob.a{width:70vmax;height:70vmax;left:-28vmax;bottom:-42vmax}.blob.b{width:46vmax;height:46vmax;right:-20vmax;top:-14vmax}
.fit{position:relative;width:calc(393px * var(--k,1));height:calc(852px * var(--k,1))}
.phone{width:393px;height:852px;transform:scale(var(--k,1));transform-origin:top left;background:var(--screen);border-radius:52px;box-shadow:0 0 0 10px #fff,0 0 0 11px var(--line),0 40px 80px -30px rgba(10,30,70,.45);position:relative;overflow:hidden;display:flex;flex-direction:column}
.sbar{flex:none;height:50px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 32px 6px;font:700 .95rem var(--f)}
.sbar svg{height:12px}
.homebar{flex:none;height:22px;display:grid;place-items:center}.homebar::after{content:"";width:130px;height:5px;border-radius:5px;background:var(--ink)}
@media (max-width:600px) and (pointer:coarse){body{overflow:auto}.stage{padding:0;display:block}.blob{display:none}.fit{width:100%;height:100vh;height:100dvh}.phone{width:100%;height:100%;transform:none;border-radius:0;box-shadow:none}.sbar,.homebar{display:none}}

.screen{flex:1;min-height:0;overflow-y:auto;padding:8px var(--g) 28px;display:flex;flex-direction:column;gap:18px;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.screen>*{flex-shrink:0}

/* row 1 */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px}
.title{font:800 1.875rem/1.15 var(--f);letter-spacing:-.015em}
.round{width:52px;height:52px;border-radius:50%;border:none;background:#fff;box-shadow:var(--shadow);display:grid;place-items:center;color:var(--navy);font:800 1.05rem var(--f);flex:none}
.round[aria-pressed="true"]{background:var(--navy);color:#fff}
.label{font:700 .95rem var(--f);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}

/* status card */
.card{background:#fff;border-radius:var(--r);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:6px 12px;font:700 .95rem var(--f);white-space:nowrap}
.pill i{width:9px;height:9px;border-radius:50%;background:currentColor}
.pill.wait{background:var(--orange-soft);color:var(--orange-text)}
.pill.go{background:var(--tile-2);color:var(--navy)}
.pill.ok{background:var(--green-soft);color:var(--green)}
.pill.off{background:var(--soft);color:var(--muted)}
.summary{font:800 1.45rem/1.25 var(--f)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.steps li{display:grid;grid-template-columns:36px 1fr;gap:14px;position:relative;padding-bottom:16px;align-items:start}
.steps li:last-child{padding-bottom:0}
.steps li::before{content:"";position:absolute;left:17px;top:38px;bottom:2px;border-left:2px dashed var(--line)}
.steps li:last-child::before{display:none}
.steps .c{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--soft);border:1px solid var(--line);color:var(--muted);font:700 .95rem var(--f)}
.steps .c svg{width:18px;height:18px}
.steps li.done .c{background:var(--navy);border-color:var(--navy);color:#fff}
.steps li.done::before{border-left-style:solid;border-color:var(--navy)}
.steps li.cur .c{background:var(--orange);border-color:var(--orange);color:var(--ink);box-shadow:0 0 0 5px var(--orange-soft)}
.steps b{font:700 1.1rem/1.3 var(--f);display:block;padding-top:6px}
.steps li:not(.done):not(.cur) b{color:var(--muted);font-weight:600}
.steps small{display:block;font-size:.98rem;color:var(--muted)}
.audio{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;width:100%;min-height:64px;padding:8px 14px 8px 8px;border-radius:16px;border:none;background:var(--soft)}
.audio .p{width:48px;height:48px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center}
.audio .p svg{width:20px;height:20px}
.audio b{font:700 1.05rem var(--f)}
.audio .bar{height:4px;border-radius:4px;background:var(--line);margin-top:6px;overflow:hidden}
.audio .bar i{display:block;height:100%;width:0;background:var(--navy)}
.audio time{font:600 .95rem var(--f);color:var(--muted);font-variant-numeric:tabular-nums}

/* main hold-to-talk control */
.talk{position:relative;overflow:hidden;display:grid;grid-template-columns:84px 1fr;gap:18px;align-items:center;width:100%;min-height:168px;padding:22px;border:none;border-radius:26px;color:var(--ink);background:linear-gradient(135deg,#FBAE55 0%,#F7992B 55%,#F28A14 100%);box-shadow:0 18px 30px -18px rgba(242,138,20,.95);user-select:none;-webkit-user-select:none;touch-action:none;transition:transform .12s ease}
.talk::before,.talk::after{content:"";position:absolute;border-radius:50%;border:14px solid rgba(255,255,255,.18);pointer-events:none}
.talk::before{width:200px;height:200px;right:-64px;top:-76px}
.talk::after{width:124px;height:124px;right:-30px;bottom:-66px;border-width:10px}
.talk .m{position:relative;z-index:1;width:84px;height:84px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 6px 14px -6px rgba(15,29,51,.35)}
.talk .m svg{width:40px;height:40px}
.talk .t{position:relative;z-index:1;display:flex;flex-direction:column;gap:4px}
.talk b{font:800 1.6rem/1.15 var(--f)}
.talk small{font:600 1.05rem var(--f)}
.talk.rec{transform:scale(.985);background:linear-gradient(135deg,#F28A14,#E07A08)}
.talk.rec .m::before,.talk.rec .m::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:5px solid #fff;opacity:.6;animation:ring 1.6s ease-out infinite}
.talk.rec .m::after{animation-delay:.8s}
@keyframes ring{from{transform:scale(.9);opacity:.6}to{transform:scale(1.45);opacity:0}}
.talk.busy{background:linear-gradient(135deg,#FCC27F,#F7A94B)}
.spin{width:36px;height:36px;border-radius:50%;border:4px solid var(--tile-2);border-top-color:var(--navy);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.timer{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.timer i{width:10px;height:10px;border-radius:50%;background:var(--red);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}

.heard{background:#fff;border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);font:600 1.3rem/1.45 var(--f);min-height:96px}
.heard .ph{color:var(--muted);font-weight:400}
.cursor{display:inline-block;width:2px;height:1.1em;background:var(--orange-deep);vertical-align:-3px;margin-left:2px;animation:blink 1s infinite}
.note{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;font-size:1rem;color:var(--muted)}
.note svg{width:22px;height:22px;color:var(--navy);margin-top:1px}

.alert{display:grid;grid-template-columns:24px 1fr;gap:12px;align-items:start;background:var(--red-soft);color:var(--ink);border-radius:16px;padding:14px 16px;font-size:1.05rem}
.alert svg{width:22px;height:22px;color:var(--red);margin-top:1px}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:60px;border-radius:16px;border:1px solid transparent;font:700 1.15rem var(--f);text-align:center}
.btn svg{width:22px;height:22px}
.b-navy{background:var(--navy);color:#fff;box-shadow:0 10px 20px -14px rgba(13,59,126,.9)}
.b-red{background:#fff;color:var(--red);border-color:#D9A19B}
.b-redfill{background:var(--red);color:#fff}
.b-line{background:#fff;color:var(--navy);border-color:var(--field)}
.row{display:grid;grid-template-columns:48px 1fr 24px;gap:14px;align-items:center;width:100%;min-height:72px;padding:12px 16px;border-radius:var(--r);border:none;background:#fff;box-shadow:var(--shadow)}
.row .i{width:48px;height:48px;border-radius:14px;background:var(--tile);color:var(--navy);display:grid;place-items:center}
.row .i svg{width:24px;height:24px}
.row b{font:700 1.15rem var(--f)}
.row .chev{width:24px;height:24px;transition:transform .15s}
.row[aria-expanded="true"] .chev{transform:rotate(90deg)}
textarea{width:100%;min-height:96px;border-radius:16px;border:1px solid var(--field);padding:14px 16px;font:400 1.15rem/1.4 var(--f);color:var(--ink);background:#fff;resize:vertical}
textarea:focus{outline:none;border:2px solid var(--navy)}
.past{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:center;padding:12px 16px;border-radius:16px;background:#fff;box-shadow:var(--shadow)}
.past .i{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.past .i svg{width:20px;height:20px}
.past b{font:700 1.05rem var(--f);display:block}
.past small{font-size:.95rem;color:var(--muted)}

/* sheet */
.scrim{position:absolute;inset:0;background:rgba(10,20,40,.45);display:flex;align-items:flex-end;z-index:10}
.sheet{background:#fff;width:100%;border-radius:24px 24px 0 0;padding:12px var(--g) 26px;display:flex;flex-direction:column;gap:14px;animation:up .22s ease both}
.grab{width:44px;height:5px;border-radius:5px;background:var(--line);align-self:center}
@keyframes up{from{transform:translateY(40px)}to{transform:none}}
.toast{position:absolute;left:14px;right:14px;top:8px;z-index:12;background:var(--ink);color:#fff;border-radius:16px;padding:14px 16px;display:grid;grid-template-columns:24px 1fr;gap:12px;align-items:center;font:600 1.05rem/1.35 var(--f);animation:down .25s ease both}
.toast svg{width:22px;height:22px;color:var(--orange)}
@keyframes down{from{transform:translateY(-16px);opacity:0}to{transform:none;opacity:1}}

/* presenter menu (D key / long-press greeting) */
.demo{position:fixed;right:16px;top:16px;z-index:50;font-family:var(--f)}
.demo .menu{background:#fff;border:1px solid var(--line);border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:2px;width:270px;box-shadow:0 20px 40px -20px rgba(8,20,40,.45)}
.demo .menu p{font:700 .75rem var(--f);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 12px 2px;margin:0}
.demo .menu button{border:none;background:none;border-radius:10px;padding:10px 12px;font:600 .95rem var(--f);min-height:42px}
.demo .menu button:hover{background:var(--soft)}
@media (max-width:600px) and (pointer:coarse){.demo{left:12px;right:12px;top:auto;bottom:12px}.demo .menu{width:auto}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div class="stage">
<span class="blob a" aria-hidden="true"></span><span class="blob b" aria-hidden="true"></span>
<div class="fit"><div class="phone" aria-label="HaloBlisko — ekran domowy seniora">
<div class="sbar" aria-hidden="true"><span>9:41</span><svg viewBox="0 0 64 12" fill="#0F1D33"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="6" width="3" height="6" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/><path d="M30 3.5a9 9 0 0112 0l-1.6 1.7a6.6 6.6 0 00-8.8 0zM33 6.7a4.6 4.6 0 016 0L36 10z"/><rect x="45" y="1" width="17" height="10" rx="3" fill="none" stroke="#0F1D33" stroke-width="1.4"/><rect x="47" y="3" width="13" height="6" rx="1.5"/></svg></div>

<main class="screen" id="screen" aria-labelledby="hello">
  <div class="top"><h1 class="title" id="hello">Dzień dobry, Anno</h1><button class="round" id="bigText" aria-pressed="false" aria-label="Większe litery">A+</button></div>

  <!-- STATUS (open request: ready | assigned | revealed; or just done) -->
  <section class="card" id="status" hidden aria-live="polite">
    <div class="card-head"><span class="pill" id="pill"><i aria-hidden="true"></i><span id="pillT"></span></span></div>
    <p class="summary" id="summary">Apteka, jutro o dziesiątej</p>
    <ol class="steps" id="steps"></ol>
    <button class="audio" id="audio" aria-label="Odsłuchaj swoje nagranie"><span class="p" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg></span><span><b>Twoje nagranie</b><span class="bar"><i id="audioBar"></i></span></span><time>0:06</time></button>
    <button class="btn b-red" id="cancelBtn">Anuluj prośbę</button>
  </section>

  <!-- MAIN CONTROL -->
  <button class="talk" id="talk" aria-describedby="talkHint">
    <span class="m" aria-hidden="true" id="talkIcon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3.5"/></svg></span>
    <span class="t"><b id="talkT">Przytrzymaj i&nbsp;mów</b><small id="talkS">Powiedz, czego potrzebujesz</small></span>
  </button>

  <div class="heard" id="heard" hidden aria-live="polite"><span class="ph">Słucham…</span></div>
  <p class="note" id="talkHint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 018 0v2.5"/></svg><span>Nagranie usłyszy tylko koordynatorka z&nbsp;MOPS.</span></p>

  <div class="alert" id="err" hidden role="alert"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5v.01"/></svg><span id="errT"></span></div>

  <!-- last closed request -->
  <div class="past" id="past" hidden><span class="i" id="pastI" aria-hidden="true"></span><span><b id="pastT"></b><small id="pastS"></small></span></div>

  <!-- fallback: no microphone -->
  <button class="row" id="typeToggle" aria-expanded="false" aria-controls="typeBox"><span class="i" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg></span><b>Wpisz zamiast mówić</b><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
  <div id="typeBox" class="card" hidden>
    <label for="phrase" class="label">Twoja prośba</label>
    <textarea id="phrase">Apteka, jutro o dziesiątej. Kod 4821</textarea>
    <button class="btn b-navy" id="sendText">Wyślij</button>
  </div>
</main>

<!-- cancel confirm -->
<div class="scrim" id="shCancel" hidden role="dialog" aria-modal="true" aria-labelledby="h-cancel"><div class="sheet">
  <span class="grab" aria-hidden="true"></span>
  <b id="h-cancel" style="font:800 1.5rem var(--f)">Anulować prośbę?</b>
  <p class="muted">Koordynatorka i&nbsp;wolontariusz dostaną informację.</p>
  <button class="btn b-redfill" id="cancelYes">Tak, anuluj</button>
  <button class="btn b-line" id="cancelNo">Nie</button>
</div></div>
<div class="toast" id="toast" hidden role="status"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span id="toastT"></span></div>
<div class="homebar" aria-hidden="true"></div>
</div></div>
</div>

<div class="demo"><div class="menu" id="menu" hidden>
  <p>Koordynatorka / wolontariusz</p>
  <button data-s="assigned">Przydzieliła: Jan Wójcik</button>
  <button data-s="revealed">Jan otworzył zlecenie</button>
  <button data-s="done">Jan oznaczył „wydane”</button>
  <p>Błędy</p>
  <button data-e="short">Puszczone za szybko</button>
  <button data-e="mic">Brak zgody na mikrofon</button>
  <button data-s="reset">↺ Od nowa</button>
</div></div>

<script>
document.documentElement.lang='pl';
(function(){const fit=()=>{const t=matchMedia('(max-width:600px) and (pointer:coarse)').matches;const k=t?1:Math.min(1,(innerHeight-48)/(852+24),(innerWidth-32)/(393+24));document.documentElement.style.setProperty('--k',k.toFixed(3))};fit();addEventListener('resize',fit)})();
(function(){
  const $=s=>document.querySelector(s);
  const CK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  const MIC='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3.5"/></svg>';
  const SAY='Apteka, jutro o dziesiątej. Kod 4821';
  const VOL='Jan';
  /* request mirrors PublicRequest: status ready|assigned|revealed|done|cancelled */
  let req=null, rec=false, busy=false, t0=0, timers=[], words=0;
  const later=(f,ms)=>timers.push(setTimeout(f,ms)), clearT=()=>{timers.forEach(clearTimeout);timers=[]};
  const summaryOf=t=>t.replace(/\b(?:kod|code)\b/gi,'').replace(/\b\d{4}\b/g,'').replace(/\s+/g,' ').replace(/\s+([,.])/g,'$1').replace(/[.\s]+$/,'').trim();

  const PILL={ready:['wait','Czeka na koordynatorkę'],assigned:['go','Pomoc umówiona'],revealed:['go','Pomoc w drodze'],done:['ok','Gotowe'],cancelled:['off','Anulowana']};
  function steps(s){
    const idx={ready:1,assigned:2,revealed:3,done:4}[s]??0;
    const rows=[['Wysłana','dzisiaj, 9:41'],['Koordynatorka wybiera osobę','MOPS Krowodrza'],[idx>=2?`Pomoże ${VOL}`:'Ktoś pomoże',idx>=2?'wolontariusz z Twojej dzielnicy':''],[idx>=4?'Gotowe':`${idx>=3?VOL+' załatwia sprawę':'Załatwione'}`,'']];
    return rows.map((r,i)=>{const cls=i<idx?'done':(i===idx?'cur':'');return `<li class="${cls}"><span class="c" aria-hidden="true">${i<idx?CK:i+1}</span><span><b>${r[0]}</b>${r[1]?`<small>${r[1]}</small>`:''}</span></li>`}).join('');
  }
  function render(){
    const open=req&&['ready','assigned','revealed'].includes(req.status);
    $('#status').hidden=!(open||req?.status==='done');
    if(req&&!$('#status').hidden){
      const [cls,txt]=PILL[req.status]; $('#pill').className='pill '+cls; $('#pillT').textContent=req.status==='assigned'||req.status==='revealed'?`${txt}: ${VOL}`:txt;
      $('#summary').textContent=req.summary; $('#steps').innerHTML=steps(req.status==='done'?'done':req.status);
      $('#audio').hidden=!req.audio; $('#cancelBtn').hidden=!open;
    }
    $('#past').hidden=!(req&&req.status==='cancelled');
    if(req&&req.status==='cancelled'){ $('#pastI').style.cssText='background:var(--soft);color:var(--muted)'; $('#pastI').innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'; $('#pastT').textContent=req.summary; $('#pastS').textContent='Anulowana'; }
    // main control label
    const T=$('#talkT'),S=$('#talkS'),talk=$('#talk');
    talk.classList.toggle('rec',rec); talk.classList.toggle('busy',busy);
    $('#heard').hidden=!rec&&!busy;
    if(rec){T.textContent='Mów…';S.innerHTML='<span class="timer"><i aria-hidden="true"></i><span id="tm">0:00</span></span> · puść, gdy skończysz';$('#talkIcon').innerHTML=MIC}
    else if(busy){T.textContent='Wysyłam…';S.textContent='Zamieniam nagranie na tekst';$('#talkIcon').innerHTML='<span class="spin"></span>'}
    else{T.innerHTML=open?'Nowa prośba':'Przytrzymaj i&nbsp;mów';S.textContent=open?'Przytrzymaj i mów':'Powiedz, czego potrzebujesz';$('#talkIcon').innerHTML=MIC}
  }
  function err(t){$('#errT').textContent=t;$('#err').hidden=!t}
  function toast(t){$('#toastT').textContent=t;$('#toast').hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>$('#toast').hidden=true,2800)}

  /* ----- hold-to-talk (as in repo). Short tap = toggle mode for people who cannot hold. ----- */
  let downAt=0, toggleMode=false;
  function begin(){ if(busy)return; err(''); rec=true; t0=Date.now(); words=0; render();
    $('#heard').innerHTML='<span class="ph">Słucham…</span>';
    const w=SAY.split(' '); const tick=()=>{const s=Math.floor((Date.now()-t0)/1000);const el=$('#tm');if(el)el.textContent='0:'+String(s).padStart(2,'0');if(rec)later(tick,250)};tick();
    const add=()=>{if(!rec||words>=w.length)return;words++;$('#heard').innerHTML=w.slice(0,words).join(' ')+'<span class="cursor" aria-hidden="true"></span>';later(add,330)};later(add,600);
  }
  function end(){ if(!rec)return; rec=false; clearT();
    if(words<2){render();err('Przytrzymaj przycisk i mów, aż skończysz zdanie.');return}
    const text=SAY.split(' ').slice(0,words).join(' ');
    busy=true; render(); $('#heard').innerHTML=text;
    later(()=>{busy=false; req={status:'ready',summary:summaryOf(text)||'Nagranie głosowe',audio:true}; render(); toast('Wysłane do koordynatorki');},1400);
  }
  const talk=$('#talk');
  talk.addEventListener('pointerdown',e=>{e.preventDefault();try{talk.setPointerCapture(e.pointerId)}catch{} if(toggleMode&&rec){toggleMode=false;end();return} downAt=Date.now();begin()});
  talk.addEventListener('pointerup',()=>{ if(!rec||toggleMode)return; if(Date.now()-downAt<450){toggleMode=true;$('#talkS').innerHTML='<span class="timer"><i aria-hidden="true"></i><span id="tm">0:00</span></span> · naciśnij, gdy skończysz';return} end()});
  talk.addEventListener('pointercancel',()=>{if(!toggleMode)end()});
  talk.addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&!e.repeat){e.preventDefault();rec?end():begin()}});
  talk.addEventListener('contextmenu',e=>e.preventDefault());

  /* audio playback (simulated) */
  $('#audio').addEventListener('click',()=>{const bar=$('#audioBar');bar.style.transition='none';bar.style.width='0';requestAnimationFrame(()=>{bar.style.transition='width 6s linear';bar.style.width='100%'})});
  /* cancel */
  $('#cancelBtn').addEventListener('click',()=>{$('#shCancel').hidden=false;$('#cancelYes').focus()});
  $('#cancelNo').addEventListener('click',()=>{$('#shCancel').hidden=true;$('#cancelBtn').focus()});
  $('#shCancel').addEventListener('click',e=>{if(e.target.id==='shCancel')$('#shCancel').hidden=true});
  $('#cancelYes').addEventListener('click',()=>{$('#shCancel').hidden=true;req.status='cancelled';render();toast('Prośba anulowana')});
  /* type instead */
  $('#typeToggle').addEventListener('click',e=>{const o=e.currentTarget.getAttribute('aria-expanded')==='true';e.currentTarget.setAttribute('aria-expanded',!o);$('#typeBox').hidden=o;if(!o)$('#phrase').focus()});
  $('#sendText').addEventListener('click',()=>{const t=$('#phrase').value.trim();if(!t)return;req={status:'ready',summary:summaryOf(t),audio:false};$('#typeBox').hidden=true;$('#typeToggle').setAttribute('aria-expanded','false');render();toast('Wysłane do koordynatorki')});
  $('#bigText').addEventListener('click',e=>{const on=document.documentElement.classList.toggle('big');e.currentTarget.setAttribute('aria-pressed',on)});

  /* presenter menu */
  const menu=$('#menu');
  document.addEventListener('keydown',e=>{if((e.key==='d'||e.key==='D')&&!e.target.closest('textarea'))menu.hidden=!menu.hidden;if(e.key==='Escape'){menu.hidden=true;$('#shCancel').hidden=true}});
  let lp;const h=$('#hello');h.addEventListener('pointerdown',()=>{lp=setTimeout(()=>menu.hidden=false,700)});['pointerup','pointerleave'].forEach(v=>h.addEventListener(v,()=>clearTimeout(lp)));
  document.addEventListener('pointerdown',e=>{if(!menu.hidden&&!e.target.closest('.demo')&&e.target!==h)menu.hidden=true});
  menu.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;menu.hidden=true;
    if(b.dataset.e==='short'){err('Przytrzymaj przycisk i mów, aż skończysz zdanie.');return}
    if(b.dataset.e==='mic'){err('Przeglądarka nie puściła mikrofonu. Odśwież stronę i naciśnij jeszcze raz.');return}
    const s=b.dataset.s; err('');
    if(s==='reset'){req=null;rec=false;busy=false;clearT();render();return}
    if(!req||req.status==='cancelled')req={status:'ready',summary:'Apteka, jutro o dziesiątej',audio:true};
    req.status=s; render();
    toast({assigned:'Jan Wójcik pomoże Pani',revealed:'Jan zajmuje się sprawą',done:'Gotowe! Leki wydane'}[s]);
  });
  render();
})();
</script>

</body>
</html>
